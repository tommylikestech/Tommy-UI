name: Check wireless update feed
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify feed with the Android client's parser
        run: |
          set -eu
          src=overlay/packages/apps/Settings
          mkdir -p "$RUNNER_TEMP/feed-classes"
          openssl pkey -pubin -in feed-public.pem -outform DER | cmp - "$src/res/raw/tommy_feed_key.der"
          javac -d "$RUNNER_TEMP/feed-classes" "$src/src/com/android/settings/tommyui/UpdateFeed.java" tests/UpdateFeedTest.java
          java -cp "$RUNNER_TEMP/feed-classes" com.android.settings.tommyui.UpdateFeedTest docs/version.txt "$src/res/raw/tommy_feed_key.der"
          if [ -f docs/trial/version.txt ]; then
            java -cp "$RUNNER_TEMP/feed-classes" com.android.settings.tommyui.UpdateFeedTest docs/trial/version.txt "$src/res/raw/tommy_feed_key.der"
          fi
